name: Run API integration tests

on:
    workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      hawkbit:
        image: hawkbit/hawkbit-update-server:1.1.0
        ports: 
          - 8080:8080
        volumes: 
          - ${{github.workspace}}/tests/integration/hawkbit/api/testdata:/app/artifactrepo
        env:
          SPRING_DATASOURCE_URL: "jdbc:h2:/app/artifactrepo/database;MODE=LEGACY"

    steps:
    - name: Run tests
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest
